name: dev-round
description: One development round, execute, run check and test, check; the agent calls are made by the wf CLI
inputs:
  claude_code_oauth_token: {required: true}
  repository: {required: true}
  issue: {required: true}
  round: {required: true}
  base: {required: true, description: "Commit the branch was cut from"}
  plan_file: {required: true}
  wf:
    description: Path of the built `wf` CLI (the setup-cli action's `wf` output)
    required: true
  claude_dir:
    description: Directory of the pinned claude binary (the setup-cli action's `claude_dir` output)
    required: true
  findings_file: {required: false, default: none}
  execute_model: {required: true}
  check_model: {required: true}
  check_command: {required: false, default: ""}
  test_command: {required: false, default: ""}
  test_paths: {required: false, default: "", description: "Comma-separated globs of test files; empty turns the red check off"}
outputs:
  outcome:
    description: done, blocked or failed
    value: ${{ steps.verdict.outputs.outcome }}
  verdict:
    description: pass, fail or none
    value: ${{ steps.verdict.outputs.verdict }}
  findings_file:
    value: ${{ steps.verdict.outputs.findings_file }}
  execute_record_path:
    value: ${{ runner.temp }}/run-record-dev-execute-r${{ inputs.round }}.json
  check_record_path:
    value: ${{ runner.temp }}/run-record-dev-check-r${{ inputs.round }}.json
runs:
  using: composite
  steps:
    # the executor call: the CLI runs the pinned claude with the file tools, plain git commits and the
    # consumer's check and test commands only, in the checkout, with copies of the plan and findings
    - id: execute
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        CHECK: ${{ inputs.check_command }}
        TEST: ${{ inputs.test_command }}
        WF: ${{ inputs.wf }}
        CLAUDE_DIR: ${{ inputs.claude_dir }}
        REPO: ${{ inputs.repository }}
        ISSUE: ${{ inputs.issue }}
        ROUND: ${{ inputs.round }}
        MODEL: ${{ inputs.execute_model }}
        PLAN_FILE: ${{ inputs.plan_file }}
        FINDINGS_FILE: ${{ inputs.findings_file }}
      run: |
        set -euo pipefail
        PATH="$CLAUDE_DIR:$PATH" "$WF" executor execute --repo "$REPO" --issue "$ISSUE" --round "$ROUND" \
          --model "$MODEL" --plan-file "$PLAN_FILE" --findings-file "$FINDINGS_FILE" --work-dir "$RUNNER_TEMP" \
          --github-output "$GITHUB_OUTPUT"

    - id: commands
      if: steps.execute.outcome == 'success' && fromJSON(steps.execute.outputs.structured_output || '{}').outcome == 'done'
      shell: bash
      env:
        CHECK: ${{ inputs.check_command }}
        TEST: ${{ inputs.test_command }}
        ROUND: ${{ inputs.round }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/round-$ROUND-results.md"
        run_one() { # name command
          local name=$1 cmd=$2 code=0 log
          log="$RUNNER_TEMP/$name.log"
          if [ -z "$cmd" ]; then
            printf '### %s\nnot configured\n\n' "$name" >> "$out"; return
          fi
          bash -c "$cmd" > "$log" 2>&1 || code=$?
          printf '### %s\ncommand: `%s`\nexit code: %s\n```\n%s\n```\n\n' \
            "$name" "$cmd" "$code" "$(tail -n 60 "$log" | tail -c 4000)" >> "$out"
          echo "${name}_exit=$code" >> "$GITHUB_OUTPUT"
        }
        : > "$out"
        run_one check "$CHECK"
        run_one test "$TEST"
        echo "results_file=$out" >> "$GITHUB_OUTPUT"

    # the new tests must fail on the base tree: run the test command there with the test files
    # of this change that have added lines (a file that only lost lines is skipped) and record the
    # exit code; a pass on the base forces fail in the verdict step
    - id: red
      if: steps.commands.outcome == 'success'
      shell: bash
      env:
        TEST: ${{ inputs.test_command }}
        TEST_PATHS: ${{ inputs.test_paths }}
        BASE: ${{ inputs.base }}
        ROUND: ${{ inputs.round }}
        RESULTS: ${{ steps.commands.outputs.results_file }}
        WF: ${{ inputs.wf }}
      run: |
        set -uo pipefail
        # the CLI reads TEST and TEST_PATHS from the environment; an error state does not fail the round
        "$WF" executor red --base "$BASE" --round "$ROUND" --work-dir "$RUNNER_TEMP" --results "$RESULTS" \
          --github-output "$GITHUB_OUTPUT" || echo "red_state=error" >> "$GITHUB_OUTPUT"

    # every deleted path, and every added, modified or renamed-to path under .github/workflows, must be
    # named in the plan's Files list; a path outside it, or a diff or plan that cannot be read (error),
    # makes the verdict step fail the round
    - id: scope
      if: steps.commands.outcome == 'success'
      shell: bash
      env:
        PLAN_FILE: ${{ inputs.plan_file }}
        BASE: ${{ inputs.base }}
        RESULTS: ${{ steps.commands.outputs.results_file }}
        WF: ${{ inputs.wf }}
      run: |
        set -uo pipefail
        # fail closed: a CLI that did not run to its end leaves the state at error, which fails the round
        "$WF" executor scope --base "$BASE" --plan-file "$PLAN_FILE" --results "$RESULTS" \
          --github-output "$GITHUB_OUTPUT" || echo "scope_state=error" >> "$GITHUB_OUTPUT"

    # the check call: read-only tools and git diff and log, in the checkout, with copies of the plan
    # and the results
    - id: check
      if: steps.commands.outcome == 'success'
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        WF: ${{ inputs.wf }}
        CLAUDE_DIR: ${{ inputs.claude_dir }}
        REPO: ${{ inputs.repository }}
        ISSUE: ${{ inputs.issue }}
        ROUND: ${{ inputs.round }}
        MODEL: ${{ inputs.check_model }}
        PLAN_FILE: ${{ inputs.plan_file }}
        RESULTS: ${{ steps.commands.outputs.results_file }}
        BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        PATH="$CLAUDE_DIR:$PATH" "$WF" executor check --repo "$REPO" --issue "$ISSUE" --round "$ROUND" \
          --model "$MODEL" --plan-file "$PLAN_FILE" --results-file "$RESULTS" --base "$BASE" \
          --work-dir "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"

    - id: verdict
      if: always()
      shell: bash
      env:
        EXECUTE: ${{ steps.execute.outputs.structured_output }}
        CHECK: ${{ steps.check.outputs.structured_output }}
        CHECK_EXIT: ${{ steps.commands.outputs.check_exit }}
        TEST_EXIT: ${{ steps.commands.outputs.test_exit }}
        RED_STATE: ${{ steps.red.outputs.red_state }}
        SCOPE_STATE: ${{ steps.scope.outputs.scope_state }}
        SCOPE_VIOLATIONS: ${{ steps.scope.outputs.scope_violations }}
        SCOPE_KINDS: ${{ steps.scope.outputs.scope_violation_kinds }}
        ROUND: ${{ inputs.round }}
        WF: ${{ inputs.wf }}
      run: |
        set -uo pipefail
        # the CLI reads the round's results from the environment above; a CLI that does not run to its
        # end leaves the round failed, so nothing is published from it
        "$WF" executor verdict --round "$ROUND" --findings-file "$RUNNER_TEMP/round-$ROUND-findings.md" \
          --github-output "$GITHUB_OUTPUT" || printf 'outcome=failed\nverdict=none\n' >> "$GITHUB_OUTPUT"
