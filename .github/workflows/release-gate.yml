name: release-gate

on:
  workflow_call:
    inputs:
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
      ready_label:
        type: string
        default: READY TO LIVE
      blocker_label:
        type: string
        default: release-blocker

permissions: {}

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the default branch tip to compare with the reviewed sha
      issues: read # list the open release-blocker issues and the label events
      pull-requests: read # find the release pull request and its labels
      statuses: write # set the release-gate status on the release pull request head
    steps:
      - name: Evaluate the gate
        env:
          GH_TOKEN: ${{ github.token }}
          OWNERS: ${{ inputs.owners }}
          READY: ${{ inputs.ready_label }}
          BLOCKER: ${{ inputs.blocker_label }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prs=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100 \
            --jq '.[]' \
            | jq -s --arg repo "$GITHUB_REPOSITORY" --argjson n "${EVENT_PR:-0}" \
              '[.[] | select((.head.ref | startswith("release-please--branches--"))
                 and ((.head.repo.full_name // "") == $repo)
                 and ($n == 0 or .number == $n))]')
          if [ "$(jq length <<< "$prs")" -eq 0 ]; then
            echo "No open release pull request to evaluate."
            exit 0
          fi
          blockers=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/issues" \
            -f state=open -f labels="$BLOCKER" -f per_page=100 --jq '.[]' \
            | jq -s '[.[] | select(.pull_request == null) | .number]')
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq .sha)
          for n in $(jq -r '.[].number' <<< "$prs"); do
            sha=$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .head.sha' <<< "$prs")
            labeled=$(jq --arg l "$READY" --argjson n "$n" \
              '.[] | select(.number == $n) | any(.labels[]; .name == $l)' <<< "$prs")
            problems=()
            if [ "$labeled" != true ]; then
              problems+=("missing label $READY")
            else
              actor=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/events" --jq '.[]' \
                | jq -rs --arg l "$READY" \
                  '[.[] | select(.event == "labeled" and .label.name == $l)] | last | .actor.login // ""')
              case ",$OWNERS," in
                *",$actor,"*) [ -n "$actor" ] || problems+=("$READY not set by an owner") ;;
                *) problems+=("$READY not set by an owner") ;;
              esac
            fi
            review=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments" --jq '.[]' \
              | jq -s '[.[] | select(.user.login == "github-actions[bot]"
                  and (.body | startswith("<!-- release-review -->")))] | last // empty')
            if [ -n "$review" ]; then
              reviewed=$(jq -r '[(.body | split("\n") | .[1] // "")
                  | match("^<!-- release-review-sha: ([0-9a-f]{40}) -->\r?$") | .captures[0].string]
                  | first // ""' <<< "$review")
              if [ -z "$reviewed" ]; then
                problems+=("review has no recorded sha")
              elif [ "$reviewed" != "$tip" ]; then
                problems+=("review is stale (reviewed ${reviewed:0:7}, main ${tip:0:7})")
              fi
              edit=$(gh api graphql -f id="$(jq -r .node_id <<< "$review")" \
                -f query='query($id: ID!) { node(id: $id) { ... on IssueComment { lastEditedAt editor { login } } } }' \
                2> /dev/null || true)
              editor=$(jq -r 'if (.data.node // null) == null then "unreadable"
                  elif .data.node.lastEditedAt == null then "unedited"
                  else (.data.node.editor.login // "unreadable") end' <<< "${edit:-null}" 2> /dev/null \
                || echo unreadable)
              case "$editor" in
                unedited) ;;
                unreadable) problems+=("review editor unreadable") ;;
                *) case ",$OWNERS," in
                     *",$editor,"*) ;;
                     *) problems+=("review edited by non-owner") ;;
                   esac ;;
              esac
            fi
            if [ "$(jq length <<< "$blockers")" -gt 0 ]; then
              list=$(jq -r 'map("#\(.)") | join(", ")' <<< "$blockers")
              problems+=("open $BLOCKER: $list")
            fi
            if [ "${#problems[@]}" -eq 0 ]; then
              state=success
              desc="$READY is set and no $BLOCKER issue is open"
            else
              state=failure
              desc=$(IFS=';'; echo "${problems[*]}" | sed 's/;/; /g')
            fi
            desc=${desc:0:140}
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" -f context=release-gate -f description="$desc" \
              -f target_url="$RUN_URL" > /dev/null
            echo "PR #$n ($sha): $state: $desc" | tee -a "$GITHUB_STEP_SUMMARY"
          done
