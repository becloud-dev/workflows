name: triage

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      priority_field_id:
        type: string
        required: true
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
    secrets:
      claude_code_oauth_token:
        required: true

permissions: {}

jobs:
  triage:
    name: Triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: contains(format(',{0},', inputs.owners), format(',{0},', github.event.sender.login))
    permissions:
      contents: read
      issues: write # comment, label, set type and Priority, fix the body, create sub-issues
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the shared prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          sparse-checkout: prompts
          persist-credentials: false

      - name: Record workflow identity
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
          WF_REF: ${{ job.workflow_ref }}
          GH_WF_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "### Workflow identity"
            echo "- job.workflow_repository: \`$WF_REPO\`"
            echo "- job.workflow_sha: \`$WF_SHA\`"
            echo "- job.workflow_ref: \`$WF_REF\`"
            echo "- github.workflow_ref: \`$GH_WF_REF\`"
            echo "- prompt present: $(test -s .ai-workflows/prompts/triage.md && echo yes || echo no)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the issue type
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          kind=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.type.name // ""')
          echo "type=$kind" >> "$GITHUB_OUTPUT"

      - name: Classify
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          prompt: |
            Repository: ${{ github.repository }}
            Issue number: ${{ github.event.issue.number }}
            Issue type: ${{ steps.kind.outputs.type }}
            Read .ai-workflows/prompts/triage.md and follow it.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Bash(gh issue view:*),Bash(ls .github/ISSUE_TEMPLATE:*),Read"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["triaged","needs_info"]},"type":{"type":"string","enum":["Task","Bug","Feature"]},"priority":{"type":"string","enum":["Urgent","High","Medium","Low"]},"rationale":{"type":"string"},"questions":{"type":"array","items":{"type":"string"},"maxItems":5},"body":{"type":"string"},"format_change":{"type":"string"},"type_evidence":{"type":"string"},"priority_evidence":{"type":"string"},"children":{"type":"array","maxItems":5,"items":{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"},"type":{"type":"string","enum":["Task","Bug","Feature"]}},"required":["title","body","type"]}}},"required":["outcome","rationale"]}'

      - name: Apply the verdict
        if: steps.claude.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          ISSUE: ${{ github.event.issue.number }}
          FIELD_ID: ${{ inputs.priority_field_id }}
          ISSUE_TYPE: ${{ steps.kind.outputs.type }}
        run: |
          set -euo pipefail
          outcome=$(jq -er .outcome <<<"$VERDICT")
          jq -er .rationale <<<"$VERDICT" > "$RUNNER_TEMP/rationale.txt"
          api="repos/$GITHUB_REPOSITORY/issues/$ISSUE"
          if [ "$outcome" = needs_info ]; then
            {
              echo "More information is needed before this can be triaged:"
              echo
              jq -er '.questions | select(type == "array" and length >= 1 and length <= 5)
                      | to_entries | map("\(.key + 1). \(.value)") | .[]' <<<"$VERDICT"
              echo
              echo "Reason: $(cat "$RUNNER_TEMP/rationale.txt")"
            } > "$RUNNER_TEMP/comment.txt"
            gh issue edit "$ISSUE" --add-label needs-info
            gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx needs-info
            {
              echo "### Verdict written"
              echo "- outcome: \`needs_info\`; label \`needs-info\` read back"
            } >> "$GITHUB_STEP_SUMMARY"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.txt"
            exit 0
          fi
          if [ "$ISSUE_TYPE" = Project ]; then
            type=Project
            type_ev="Set by the author in the issue form."
          else
            type=$(jq -er .type <<<"$VERDICT")
            type_ev=$(jq -er '.type_evidence | select(type == "string" and length > 0)' <<<"$VERDICT")
          fi
          priority=$(jq -er .priority <<<"$VERDICT")
          n_children=$(jq '(.children // []) | length' <<<"$VERDICT")
          jq -e '(.children // []) | length as $n | $n == 0 or ($n >= 2 and $n <= 5 and all(.[]; (.title | length) > 0 and (.body | length) > 0))' \
            <<<"$VERDICT" > /dev/null
          if [ "$ISSUE_TYPE" = Project ] && [ "$n_children" -lt 2 ]; then
            echo "A Project needs at least two children; the verdict returned $n_children" >&2
            exit 1
          fi
          subs=$(gh api "$api" --jq '.sub_issues_summary.total')
          if [ "$n_children" -gt 0 ] && [ "$subs" -gt 0 ]; then
            n_children=0
          fi
          body=""
          if [ "$n_children" -eq 0 ]; then
            body=$(jq -r '.body // empty' <<<"$VERDICT")
          fi
          if [ -n "$body" ]; then
            jq -er '.format_change | select(type == "string" and length > 0)' <<<"$VERDICT" \
              > "$RUNNER_TEMP/format.txt"
            printf '%s\n' "$body" > "$RUNNER_TEMP/body.md"
          fi
          prio_ev=$(jq -er '.priority_evidence | select(type == "string" and length > 0)' <<<"$VERDICT")
          if [ "$ISSUE_TYPE" != Project ]; then
            gh api -X PATCH "$api" -f type="$type" --silent
          fi
          jq -n --argjson id "$FIELD_ID" --arg v "$priority" \
            '{issue_field_values:[{field_id:$id,value:$v}]}' \
            | gh api -X POST "$api/issue-field-values" --input - --silent
          got_type=$(gh api "$api" --jq '.type.name // ""')
          got_prio=$(gh api "$api/issue-field-values" \
            | jq -r --argjson id "$FIELD_ID" \
              '[.[] | select(.issue_field_id == $id)][0].single_select_option.name // ""')
          {
            echo "### Verdict written"
            echo "- type: wanted \`$type\`, read back \`$got_type\`"
            echo "- priority: wanted \`$priority\`, read back \`$got_prio\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$got_type" = "$type"
          test "$got_prio" = "$priority"
          if [ -n "$body" ]; then
            gh issue edit "$ISSUE" --body-file "$RUNNER_TEMP/body.md"
            got_body=$(gh api "$api" --jq .body | tr -d '\r')
            echo "- format: body edited, read back $(test "$got_body" = "$body" && echo equal || echo DIFFERENT)" \
              >> "$GITHUB_STEP_SUMMARY"
            test "$got_body" = "$body"
          fi
          ok=1
          created=""
          if [ "$n_children" -gt 0 ]; then
            for i in $(seq 0 $((n_children - 1))); do
              jq -er ".children[$i].body" <<<"$VERDICT" > "$RUNNER_TEMP/child.md"
              printf '\nSplit from #%s\n' "$ISSUE" >> "$RUNNER_TEMP/child.md"
              child_title=$(jq -er ".children[$i].title" <<<"$VERDICT")
              child_type=$(jq -er ".children[$i].type" <<<"$VERDICT")
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$child_title" \
                --body-file "$RUNNER_TEMP/child.md" --type "$child_type" --parent "$ISSUE") \
                || { ok=0; break; }
              created="$created ${url##*/}"
            done
            got_subs=""
            for attempt in 1 2 3 4 5; do
              got_subs=$(gh api "$api" --jq '.sub_issues_summary.total')
              [ "$got_subs" = "$n_children" ] && break
              sleep 2
            done
            echo "- split: $n_children wanted, read back sub_issues_summary.total $got_subs after $attempt read(s)" \
              >> "$GITHUB_STEP_SUMMARY"
            test "$got_subs" = "$n_children" || ok=0
          fi
          {
            cat "$RUNNER_TEMP/rationale.txt"
            printf '\nType: %s. %s\nPriority: %s. %s\n' "$type" "$type_ev" "$priority" "$prio_ev"
            if [ -n "$created" ]; then
              printf '\nSplit into:%s\n' "$(printf ' #%s' $created)"
            fi
            if [ -n "$body" ]; then
              printf '\nFormat fix: %s\n' "$(cat "$RUNNER_TEMP/format.txt")"
            fi
          } > "$RUNNER_TEMP/comment.txt"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.txt"
          test "$ok" = 1

      - name: Record the run
        if: always()
        id: record
        uses: $/.github/actions/record-run
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          stage: triage
          model: ${{ inputs.model }}
          auth: oauth
          issue: ${{ github.event.issue.number }}

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.record.outputs.record_path }}
          retention-days: 90

      - name: Remove the start label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --remove-label triage
