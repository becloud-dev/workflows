name: local-triage

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  triage:
    if: github.event.label.name == 'triage'
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the repository and the prompts
      issues: write # comment, label, set type and Priority, fix the body, create sub-issues
    uses: $/.github/workflows/triage.yml
    with:
      model: claude-haiku-5-5
      priority_field_id: ${{ vars.PRIORITY_FIELD_ID }}
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
