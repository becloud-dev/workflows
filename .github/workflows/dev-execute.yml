name: dev-execute

on:
  workflow_call:
    inputs:
      execute_model:
        type: string
        required: true
      check_model:
        type: string
        required: true
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
      setup_command:
        description: Run once before the rounds; empty for none
        type: string
        required: false
        default: ""
      check_command:
        description: Run after each execution, also allowed to the executor; empty for none
        type: string
        required: false
        default: ""
      test_command:
        description: Run after each execution, also allowed to the executor; empty for none
        type: string
        required: false
        default: ""
      test_paths:
        description: Comma-separated globs of test files, no spaces; the new tests must fail on the base tree; empty for none
        type: string
        required: false
        default: ""
      executor_app_client_id:
        description: Client ID of the executor GitHub App, which pushes the branch and opens the pull request
        type: string
        required: true
    secrets:
      claude_code_oauth_token:
        required: true
      executor_app_private_key:
        required: true

permissions: {}

jobs:
  dev-execute:
    name: Development execution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: contains(format(',{0},', inputs.owners), format(',{0},', github.event.sender.login))
    permissions:
      contents: read # check out the repository and the prompts
      issues: write # comment
    outputs:
      action: ${{ steps.final.outputs.action }}
      verdict: ${{ steps.final.outputs.verdict }}
      rounds: ${{ steps.final.outputs.rounds }}
      branch: ${{ steps.gate.outputs.branch }}
      ctype: ${{ steps.gate.outputs.ctype }}
      plan_url: ${{ steps.gate.outputs.plan_url }}
      plan_comment_id: ${{ steps.gate.outputs.plan_comment_id }}
      plan_sha256: ${{ steps.gate.outputs.plan_sha256 }}
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the shared workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false

      - name: Set up the CLI
        id: cli
        uses: $/.github/actions/setup-cli
        with:
          path: .ai-workflows

      - name: Read the approval and the plan
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          OWNERS: ${{ inputs.owners }}
          WF: ${{ steps.cli.outputs.wf }}
        run: |
          set -euo pipefail
          # the CLI replies on the issue itself when it refuses, and pins the plan it approves
          "$WF" executor gate --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --owners "$OWNERS" \
            --plan-file "$RUNNER_TEMP/plan.md" --github-output "$GITHUB_OUTPUT"
          if grep -qx 'ok=true' "$GITHUB_OUTPUT"; then
            echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the branch
        if: steps.gate.outputs.ok == 'true'
        env:
          BRANCH: ${{ steps.gate.outputs.branch }}
        run: git switch -c "$BRANCH"

      - name: Set up
        if: steps.gate.outputs.ok == 'true' && inputs.setup_command != ''
        env:
          SETUP: ${{ inputs.setup_command }}
        run: bash -c "$SETUP"

      - name: Round 1
        id: r1
        if: steps.gate.outputs.ok == 'true'
        continue-on-error: true
        uses: $/.github/actions/dev-round
        with:
          wf: ${{ steps.cli.outputs.wf }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue: ${{ github.event.issue.number }}
          round: "1"
          base: ${{ steps.gate.outputs.base }}
          plan_file: ${{ steps.gate.outputs.plan_file }}
          execute_model: ${{ inputs.execute_model }}
          check_model: ${{ inputs.check_model }}
          check_command: ${{ inputs.check_command }}
          test_command: ${{ inputs.test_command }}
          test_paths: ${{ inputs.test_paths }}

      - name: Round 2
        id: r2
        if: steps.r1.outputs.outcome == 'done' && steps.r1.outputs.verdict == 'fail'
        continue-on-error: true
        uses: $/.github/actions/dev-round
        with:
          wf: ${{ steps.cli.outputs.wf }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue: ${{ github.event.issue.number }}
          round: "2"
          base: ${{ steps.gate.outputs.base }}
          plan_file: ${{ steps.gate.outputs.plan_file }}
          findings_file: ${{ steps.r1.outputs.findings_file }}
          execute_model: ${{ inputs.execute_model }}
          check_model: ${{ inputs.check_model }}
          check_command: ${{ inputs.check_command }}
          test_command: ${{ inputs.test_command }}
          test_paths: ${{ inputs.test_paths }}

      - name: Round 3
        id: r3
        if: steps.r2.outputs.outcome == 'done' && steps.r2.outputs.verdict == 'fail'
        continue-on-error: true
        uses: $/.github/actions/dev-round
        with:
          wf: ${{ steps.cli.outputs.wf }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue: ${{ github.event.issue.number }}
          round: "3"
          base: ${{ steps.gate.outputs.base }}
          plan_file: ${{ steps.gate.outputs.plan_file }}
          findings_file: ${{ steps.r2.outputs.findings_file }}
          execute_model: ${{ inputs.execute_model }}
          check_model: ${{ inputs.check_model }}
          check_command: ${{ inputs.check_command }}
          test_command: ${{ inputs.test_command }}
          test_paths: ${{ inputs.test_paths }}

      - name: Decide what to publish
        id: final
        if: always() && steps.gate.outputs.ok == 'true'
        env:
          BASE: ${{ steps.gate.outputs.base }}
          R1_OUTCOME: ${{ steps.r1.outputs.outcome }}
          R1_VERDICT: ${{ steps.r1.outputs.verdict }}
          R1_FINDINGS: ${{ steps.r1.outputs.findings_file }}
          R2_OUTCOME: ${{ steps.r2.outputs.outcome }}
          R2_VERDICT: ${{ steps.r2.outputs.verdict }}
          R2_FINDINGS: ${{ steps.r2.outputs.findings_file }}
          R3_OUTCOME: ${{ steps.r3.outputs.outcome }}
          R3_VERDICT: ${{ steps.r3.outputs.verdict }}
          R3_FINDINGS: ${{ steps.r3.outputs.findings_file }}
        run: |
          set -euo pipefail
          outcome=none verdict=none findings="" rounds=0
          for n in 1 2 3; do
            o="R${n}_OUTCOME" v="R${n}_VERDICT" f="R${n}_FINDINGS"
            [ -n "${!o}" ] || continue
            outcome=${!o} verdict=${!v} findings=${!f} rounds=$n
          done
          ahead=$(git rev-list --count "$BASE..HEAD")
          if [ "$outcome" = done ] && [ "$ahead" -gt 0 ]; then
            if [ "$verdict" = pass ]; then action=pr; else action=draft; fi
          else
            action=comment
          fi
          if [ "$action" = pr ] || [ "$action" = draft ]; then
            # the bundle is made from a fresh git dir, so the hooks and config the rounds left in the checkout's .git do not run
            (
              export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
              mkdir -p "$RUNNER_TEMP/bundle"
              src=$(mktemp -d "$RUNNER_TEMP/bundle-src.XXXXXX")
              git init -q --bare "$src"
              # the checkout is a shallow clone; without --update-shallow the fetch refuses the ref and exits 0
              GIT_DIR=$src git fetch -q --update-shallow "$PWD" "HEAD:refs/push/head"
              GIT_DIR=$src git bundle create "$RUNNER_TEMP/bundle/publish.bundle" refs/push/head "^$BASE"
            )
          fi
          {
            echo "action=$action"
            echo "outcome=$outcome"
            echo "verdict=$verdict"
            echo "findings_file=$findings"
            echo "rounds=$rounds"
            echo "ahead=$ahead"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the bundle
        if: steps.final.outputs.action == 'pr' || steps.final.outputs.action == 'draft'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/publish.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Post the findings
        if: always() && (steps.final.outputs.action == 'draft' || steps.final.outputs.action == 'comment')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ steps.final.outputs.action }}
          OUTCOME: ${{ steps.final.outputs.outcome }}
          ROUNDS: ${{ steps.final.outputs.rounds }}
          AHEAD: ${{ steps.final.outputs.ahead }}
          FINDINGS: ${{ steps.final.outputs.findings_file }}
        run: |
          set -euo pipefail
          {
            echo '<!-- dev-execute-findings -->'
            if [ "$ACTION" = draft ]; then
              echo "A draft pull request was opened after $ROUNDS round(s); the check still fails:"
            else
              echo "No pull request was opened (last outcome: $OUTCOME, $ROUNDS round(s), $AHEAD commit(s) ahead):"
            fi
            echo
            if [ -n "$FINDINGS" ] && [ -s "$FINDINGS" ]; then cat "$FINDINGS"; else echo "No round produced a result."; fi
          } > "$RUNNER_TEMP/findings.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/findings.md"

      - name: Upload the records
        if: always() && steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-record-*.json
          if-no-files-found: warn
          retention-days: 90

  # A separate runner and environment: no step here runs round, model, setup, check or test code, so
  # nothing the rounds wrote into GITHUB_ENV, GITHUB_PATH or BASH_ENV reaches the token. It takes only the bundle and the outputs.
  # Publish re-checks the plan scope itself: it reads the approved plan's Files list from the plan comment and refuses
  # a bundle that changes a workflow or deletes a file the plan does not name, before the executor token is minted.
  dev-publish:
    name: Development publication
    needs: dev-execute
    if: needs.dev-execute.outputs.action == 'pr' || needs.dev-execute.outputs.action == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the caller repository, to compare the bundle with its base
      issues: read # read the approved plan comment for the scope check
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-bundle

      - name: Verify the bundle
        env:
          BUNDLE: ${{ runner.temp }}/publish-bundle/publish.bundle
        run: |
          set -euo pipefail
          # verify and fetch from a fresh git dir, so the config of the checkout is not read
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          base=$(git rev-parse HEAD)
          git init -q --bare "$RUNNER_TEMP/publish.git"
          export GIT_DIR="$RUNNER_TEMP/publish.git"
          # the checkout is a shallow clone; without --update-shallow the fetch refuses the ref and exits 0
          git fetch -q --update-shallow "$PWD" "HEAD:refs/base"
          git bundle verify "$BUNDLE"
          git fetch -q "$BUNDLE" "refs/push/head:refs/push/head"
          git merge-base --is-ancestor "$base" refs/push/head \
            || { echo "::error::the bundle does not extend the base commit"; exit 1; }

      - name: Check the bundle against the plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # the plan is read here from its comment, the only input besides the bundle and the base checkout; the
          # same selection as the gate: the last comment by the bot that starts with the plan marker
          plan=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq '.[]' \
            | jq -s 'map(select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- dev-plan -->")))) | last // empty')
          [ -n "$plan" ] || { echo "::error::there is no development plan comment on this issue"; exit 1; }
          jq -r .body <<< "$plan" > "$RUNNER_TEMP/publish-plan.md"
          # the backticked bullets between **Files** and the next bold line; the heading must be there
          listing="$RUNNER_TEMP/publish-plan-files.txt"
          awk 'BEGIN { seen = 0 }
               /^\*\*Files\*\*/ { inside = 1; seen = 1; next }
               inside && /^\*\*/ { inside = 0 }
               inside && /^- `[^`]+`/ { s = substr($0, 4); print substr(s, 1, index(s, "`") - 1) }
               END { exit !seen }' "$RUNNER_TEMP/publish-plan.md" > "$listing" \
            || { echo "::error::the plan has no **Files** heading"; exit 1; }
          allowed=()
          while IFS= read -r p; do allowed+=("$p"); done < "$listing"
          # literal comparison only: an entry ending in / names a directory, any other entry one file
          named() {
            local a
            for a in "${allowed[@]}"; do
              if [ "$1" = "$a" ] || { [[ $a == */ ]] && [[ $1 == "$a"* ]]; }; then return 0; fi
            done
            return 1
          }
          # the bundle's diff is read from the fresh git dir the verify step fetched it into, against the base of the checkout
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          base=$(git rev-parse HEAD)
          export GIT_DIR="$RUNNER_TEMP/publish.git"
          deleted="$RUNNER_TEMP/publish-deleted.bin" changed="$RUNNER_TEMP/publish-workflows.bin"
          git diff --name-only --no-renames -z --diff-filter=D "$base...refs/push/head" > "$deleted" \
            || { echo "::error::the deletions in the bundle could not be read"; exit 1; }
          git diff --name-only --no-renames -z --diff-filter=AM "$base...refs/push/head" -- .github/workflows > "$changed" \
            || { echo "::error::the workflow changes in the bundle could not be read"; exit 1; }
          refused=0
          while IFS= read -r -d '' p; do
            named "$p" || { echo "::error::deleted but not named in the plan Files list: $p"; refused=1; }
          done < "$deleted"
          while IFS= read -r -d '' p; do
            named "$p" || { echo "::error::changed under .github/workflows but not named in the plan Files list: $p"; refused=1; }
          done < "$changed"
          [ "$refused" = 0 ] || exit 1

      - name: Mint the executor App token
        id: executor_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.executor_app_client_id }}
          private-key: ${{ secrets.executor_app_private_key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Push the branch
        env:
          GH_TOKEN: ${{ steps.executor_app.outputs.token }}
          BRANCH: ${{ needs.dev-execute.outputs.branch }}
        run: |
          set -euo pipefail
          # push from the fresh git dir the verify step fetched the bundle into, so the checkout's hooks and config are not read
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_DIR="$RUNNER_TEMP/publish.git"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/push/head:refs/heads/${BRANCH}"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.executor_app.outputs.token }}
          BRANCH: ${{ needs.dev-execute.outputs.branch }}
          CTYPE: ${{ needs.dev-execute.outputs.ctype }}
          PLAN_URL: ${{ needs.dev-execute.outputs.plan_url }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTION: ${{ needs.dev-execute.outputs.action }}
          VERDICT: ${{ needs.dev-execute.outputs.verdict }}
          ROUNDS: ${{ needs.dev-execute.outputs.rounds }}
        run: |
          set -euo pipefail
          {
            echo "Closes #$ISSUE"
            echo
            echo "Plan: $PLAN_URL"
            echo
            echo "Check verdict: $VERDICT after $ROUNDS round(s)."
          } > "$RUNNER_TEMP/pr-body.md"
          args=(--head "$BRANCH" --base "$DEFAULT_BRANCH" --title "$CTYPE: ${TITLE,,}" --body-file "$RUNNER_TEMP/pr-body.md" --repo "$GITHUB_REPOSITORY")
          if [ "$ACTION" = draft ]; then args+=(--draft); fi
          gh pr create "${args[@]}"
