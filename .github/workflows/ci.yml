# The test suites under tests/ run the real blocks of every workflow and action in this repository;
# this runs them on each pull request. Deploys do not exist here: a release only moves the `v0` tag.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository to run the suites
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure PyYAML is available
        run: python3 -c 'import yaml' 2> /dev/null || sudo apt-get install -y python3-yaml

      - name: Run the suites
        run: bash tests/run-all.sh

  # The Rust CLI under cli/: format, lints, tests and the dependency policy on every pull request, so the
  # ruleset can require the check. The toolchain is cli/rust-toolchain.toml's, installed explicitly (the
  # runner image does not hold it under that name); cargo-deny is a pinned release binary checked against
  # its SHA-256.
  cli:
    name: Rust CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository to build and test the CLI
    defaults:
      run:
        working-directory: cli
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Check the format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: |
          start=$(date +%s)
          cargo test --locked --no-run
          echo "- build of the CLI tests: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cargo-deny"

      - name: Check the dependencies
        run: '"$RUNNER_TEMP/cargo-deny/cargo-deny" check'

  # Audits the workflows, actions and consumer templates of the head and of the base, and fails on the
  # findings the pull request adds; the findings main already has do not block. The check name stays the
  # same when skipped.
  zizmor:
    name: zizmor audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the pull request head and the base branch
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - name: Check whether the pull request changes workflows or actions
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git -C head diff --name-only "$BASE_SHA...$HEAD_SHA" -- .github/workflows .github/actions templates/consumer/.github)
          if [ -n "$changed" ]; then echo "audit=true" >> "$GITHUB_OUTPUT"; else echo "audit=false" >> "$GITHUB_OUTPUT"; fi

      - name: Audit the base and head trees with zizmor
        if: steps.scope.outputs.audit == 'true'
        run: |
          for tree in base head; do
            docker run --rm -v "$PWD/$tree:/audit:ro" ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 --offline --persona=auditor --format=json --no-exit-codes /audit/.github /audit/templates/consumer/.github > "$RUNNER_TEMP/zizmor-$tree.json"
            [ -s "$RUNNER_TEMP/zizmor-$tree.json" ] && jq -e 'type == "array"' "$RUNNER_TEMP/zizmor-$tree.json" > /dev/null || { echo "zizmor wrote no usable report for $tree" >&2; exit 1; }
          done

      - name: Report the findings the pull request adds
        if: steps.scope.outputs.audit == 'true'
        run: |
          for report in "$RUNNER_TEMP/zizmor-base.json" "$RUNNER_TEMP/zizmor-head.json"; do
            [ -s "$report" ] && jq -e 'type == "array"' "$report" > /dev/null || { echo "zizmor report missing, empty or not a JSON array: $report" >&2; exit 1; }
          done
          new=$(jq -rn --slurpfile base "$RUNNER_TEMP/zizmor-base.json" --slurpfile head "$RUNNER_TEMP/zizmor-head.json" '
            def key: [.ident, (.locations[0].symbolic.key.Local.verbatim_path // ""), (.locations[0].symbolic.annotation // "")] | @json;
            def counts: reduce (.[] | key) as $k ({}; .[$k] += 1);
            ($base[0] | counts) as $before
            | $head[0] | group_by(key) | .[]
            | select(length > ($before[.[0] | key] // 0))
            | .[0] | "new finding: \(.ident) in \(.locations[0].symbolic.key.Local.verbatim_path // "?") (\(.locations[0].symbolic.annotation // "")): \((.locations[0].concrete.feature // "") | split("\n") | .[0])"
          ') || { echo "cannot compare the zizmor reports" >&2; exit 1; }
          if [ -n "$new" ]; then echo "$new"; exit 1; fi
