# The test suites under tests/ run the real blocks of every workflow and action in this repository;
# this runs them on each pull request. Deploys do not exist here: a release only moves the `v0` tag.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure PyYAML is available
        run: python3 -c 'import yaml' 2> /dev/null || sudo apt-get install -y python3-yaml

      - name: Run the suites
        run: bash tests/run-all.sh
