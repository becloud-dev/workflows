name: planner-backlog

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
    secrets:
      claude_code_oauth_token:
        required: true

permissions: {}

# The CLI (cli/, `wf planner backlog`) builds the input, makes the order and duplicate calls through
# a pinned `claude -p --restricted`, enforces the rules and records the run. The agent reads only
# its input file: the caller's repository is not checked out.
jobs:
  planner-backlog:
    name: Planner backlog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(format(',{0},', inputs.owners), format(',{0},', github.event.sender.login))
    permissions:
      contents: read # check out this repository's CLI and prompts at the workflow's commit
      issues: read # list open issues with type, issue field values, sub-issues and dependencies; the report writes nothing
    steps:
      - name: Check out the workflows CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false

      - name: Set up the CLI
        id: cli
        uses: $/.github/actions/setup-cli
        with:
          path: .ai-workflows

      - name: Plan the backlog
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
          MODEL: ${{ inputs.model }}
          WF: ${{ steps.cli.outputs.wf }}
          CLAUDE_DIR: ${{ steps.cli.outputs.claude_dir }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/planner"
          status=0
          PATH="$CLAUDE_DIR:$PATH" "$WF" planner backlog --repo "$GITHUB_REPOSITORY" --model "$MODEL" --out "$out" || status=$?
          if [ -s "$out/summary.md" ]; then cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -s "$out/run-record-planner-backlog.json" ]; then
            {
              echo "### Run record"
              echo '```json'
              cat "$out/run-record-planner-backlog.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload the report and the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-backlog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/planner/
          if-no-files-found: warn
          retention-days: 90
