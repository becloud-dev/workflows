name: planner-backlog

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
    secrets:
      claude_code_oauth_token:
        required: true

permissions: {}

jobs:
  planner-backlog:
    name: Planner backlog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: contains(format(',{0},', inputs.owners), format(',{0},', github.event.sender.login))
    permissions:
      contents: read
      issues: read # list open issues with type and issue field values; the report writes nothing
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the shared prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          sparse-checkout: prompts
          persist-credentials: false

      - name: Build the backlog input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .planner
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            | jq '
              def rank: if . == null then 9 else ({"Urgent":1,"High":2,"Medium":3,"Low":4}[.] // 9) end;
              add
              | map(select(has("pull_request") | not)
                    | select(.milestone == null)
                    | select(any(.labels[]; .name == "needs-info") | not))
              | map({
                  number, title, created_at,
                  type: (.type.name // null),
                  priority: ((.issue_field_values // []
                              | map(select(.issue_field_name == "Priority"))[0]
                              .single_select_option.name) // null),
                  labels: [.labels[].name],
                  sub_issues: (.sub_issues_summary.total // 0),
                  body: ((.body // "")[0:600])
                })
              | sort_by([(.priority | rank), .created_at])' \
            > .planner/all.json
          jq '{
                total: length,
                truncated: (([.[] | select(.priority != null)] | length) > 100),
                issues: ([.[] | select(.priority != null)] | .[0:100]),
                unprioritised: [.[] | select(.priority == null) | del(.body)]
              }' .planner/all.json > .planner/backlog.json
          {
            echo "### Backlog input"
            echo "- open, no milestone, no PR, no needs-info: $(jq .total .planner/backlog.json)"
            echo "- ranked set sent to the model: $(jq '.issues | length' .planner/backlog.json)"
            echo "- unprioritised: $(jq '.unprioritised | length' .planner/backlog.json)"
            echo "- truncated: $(jq .truncated .planner/backlog.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          prompt: |
            Repository: ${{ github.repository }}
            Read .ai-workflows/prompts/planner-backlog.md and follow it.
            The input is .planner/backlog.json.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"order":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"reason":{"type":"string"}},"required":["number","reason"]}},"categorize":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"current_type":{"type":"string"},"suggested_type":{"type":"string","enum":["Task","Bug","Feature"]},"evidence":{"type":"string"}},"required":["number","suggested_type","evidence"]}},"gaps":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"gap":{"type":"string","enum":["no_type","stale","duplicate"]},"duplicate_of":{"type":"integer"},"evidence":{"type":"string"}},"required":["number","gap","evidence"]}},"summary":{"type":"string"}},"required":["order","categorize","gaps","summary"]}'

      - name: Validate and render the report
        if: steps.claude.outputs.structured_output != ''
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERDICT" > "$RUNNER_TEMP/verdict.json"
          # order must cover exactly the ranked set, each issue once, no tier crossed
          jq -e --slurpfile in .planner/backlog.json '
            def rank: {"Urgent":1,"High":2,"Medium":3,"Low":4}[.];
            ($in[0].issues | map({key: (.number|tostring), value: (.priority|rank)}) | from_entries) as $tier
            | (.order | map(.number)) as $got
            | ($in[0].issues | map(.number)) as $want
            | ($got | sort) == ($want | sort)
              and ($got | length) == ($got | unique | length)
              and ([$got[] | $tier[tostring]] as $t | $t == ($t | sort))' \
            "$RUNNER_TEMP/verdict.json" > /dev/null
          jq -n --slurpfile in .planner/backlog.json --slurpfile v "$RUNNER_TEMP/verdict.json" \
            '{input: $in[0], review: $v[0]}' > "$RUNNER_TEMP/backlog-report.json"
          {
            echo "### Backlog order"
            jq -r --slurpfile in .planner/backlog.json '
              ($in[0].issues | map({key: (.number|tostring), value: .}) | from_entries) as $i
              | .order | to_entries[]
              | "\(.key + 1). #\(.value.number) [\($i[.value.number|tostring].priority)] \($i[.value.number|tostring].title): \(.value.reason)"' \
              "$RUNNER_TEMP/verdict.json"
            echo
            echo "### Categorization review"
            jq -r '.categorize[] | "- #\(.number): \(.current_type // "none") -> \(.suggested_type). \(.evidence)"' "$RUNNER_TEMP/verdict.json"
            echo
            echo "### Gaps"
            jq -r '.gaps[] | "- #\(.number): \(.gap)\(if .duplicate_of then " of #\(.duplicate_of)" else "" end). \(.evidence)"' "$RUNNER_TEMP/verdict.json"
            echo
            echo "### Unprioritised"
            jq -r '.unprioritised[] | "- #\(.number) \(.title)"' .planner/backlog.json
            echo
            echo "### Summary"
            jq -r .summary "$RUNNER_TEMP/verdict.json"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/backlog-report.json" .planner/backlog-report.json

      - name: Record the run
        if: always()
        id: record
        uses: $/.github/actions/record-run
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          stage: planner-backlog
          model: ${{ inputs.model }}
          auth: oauth
          issue: backlog

      - name: Upload the report and the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-backlog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.record.outputs.record_path }}
            .planner/backlog-report.json
          if-no-files-found: warn
          retention-days: 90
