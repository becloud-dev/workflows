name: local-dev-plan

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  dev-plan:
    if: github.event.label.name == 'RELEASE'
    concurrency:
      group: dev-plan-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the repository and the prompts
      issues: write # comment, add the needs-info label
    uses: $/.github/workflows/dev-plan.yml
    with:
      model: claude-sonnet-5-5
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
