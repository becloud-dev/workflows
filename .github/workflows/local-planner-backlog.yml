name: local-planner-backlog

on:
  workflow_dispatch:

permissions: {}

jobs:
  planner-backlog:
    concurrency:
      group: planner-backlog
      cancel-in-progress: false
    permissions:
      contents: read # read the repository
      issues: read # list open issues with type and issue field values; the report writes nothing
    uses: $/.github/workflows/planner-backlog.yml
    with:
      model: claude-haiku-5-5
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
