name: dev-plan

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
    secrets:
      claude_code_oauth_token:
        required: true

permissions: {}

jobs:
  dev-plan:
    name: Development plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(format(',{0},', inputs.owners), format(',{0},', github.event.sender.login))
    permissions:
      contents: read # check out the caller repository and the prompts
      issues: write # comment, add the needs-info label
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the shared prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          sparse-checkout: prompts
          persist-credentials: false

      - name: Read the issue type, the author and the design gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OWNERS: ${{ inputs.owners }}
        run: |
          set -euo pipefail
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE")
          echo "type=$(jq -r '.type.name // ""' <<< "$issue")" >> "$GITHUB_OUTPUT"
          pending=$(jq -r '[.labels[].name] | index("UX/UI") != null' <<< "$issue")
          echo "design_pending=$pending" >> "$GITHUB_OUTPUT"
          # only the owners and the automation may have written what the plan reads
          ok=$(jq -n --arg a "$(jq -r .user.login <<< "$issue")" --arg o "$OWNERS" \
            '(($o | ascii_downcase | split(",")) + ["github-actions[bot]"]) | index($a | ascii_downcase) != null')
          echo "author_ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = true ]; then
            comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq '.[]' \
              | jq -s --arg o "$OWNERS" '[ .[]
                  | select((.user.login | ascii_downcase) as $l
                           | (($o | ascii_downcase | split(",")) + ["github-actions[bot]"]) | index($l) != null)
                  | {author: .user.login, created_at, body} ]')
            jq --argjson c "$comments" '{number, title, body, labels: [.labels[].name], comments: $c}' \
              <<< "$issue" > "$RUNNER_TEMP/issue.json"
            echo "issue_file=$RUNNER_TEMP/issue.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse an issue from another author
        if: steps.gate.outputs.author_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body $'<!-- dev-plan-refused -->\nNo plan was made: this issue was not written by an owner or by the automation, so its text is not used as the input of a plan.'

      - name: Skip a Project
        if: steps.gate.outputs.author_ok == 'true' && steps.gate.outputs.type == 'Project'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "A development plan applies to the sub-issues of a Project, not to the Project itself. No plan was made."

      - name: Hold until the design is confirmed
        if: steps.gate.outputs.author_ok == 'true' && steps.gate.outputs.type != 'Project' && steps.gate.outputs.design_pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body $'<!-- dev-plan-hold -->\nDesign not confirmed: this issue still carries `UX/UI`. Remove `UX/UI`, then add `RELEASE` again. No plan was made.'

      - name: Plan
        id: plan
        if: steps.gate.outputs.author_ok == 'true' && steps.gate.outputs.type != 'Project' && steps.gate.outputs.design_pending != 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          prompt: |
            Repository: ${{ github.repository }}
            Issue number: ${{ github.event.issue.number }}
            Issue file: ${{ steps.gate.outputs.issue_file }}
            Read .ai-workflows/prompts/dev-plan.md and follow it.
          claude_args: |
            --model ${{ inputs.model }}
            --setting-sources user
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["planned","needs_info"]},"rationale":{"type":"string"},"questions":{"type":"array","items":{"type":"string"},"maxItems":5},"objective":{"type":"string"},"steps":{"type":"array","items":{"type":"string"},"maxItems":10},"spec":{"type":"array","maxItems":10,"items":{"type":"object","properties":{"test":{"type":"string"},"asserts":{"type":"string"}},"required":["test","asserts"]}},"acceptance_criteria":{"type":"array","items":{"type":"string"},"maxItems":10},"security":{"type":"array","maxItems":10,"items":{"type":"object","properties":{"category":{"type":"string","enum":["A01","A02","A03","A04","A05","A06","A07","A08","A09","A10"]},"risk":{"type":"string"},"control":{"type":"string"},"criterion":{"type":"integer","minimum":1},"test":{"type":"integer","minimum":1}},"required":["category","risk","control","criterion","test"]}},"files":{"type":"array","items":{"type":"string"}},"risks":{"type":"array","items":{"type":"string"}}},"required":["outcome","rationale"]}'

      - name: Post the plan
        if: steps.plan.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.plan.outputs.structured_output }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/plan.json"
          printf '%s\n' "$VERDICT" > "$f"
          outcome=$(jq -er .outcome "$f")
          if [ "$outcome" = needs_info ]; then
            jq -e '.questions | type == "array" and length >= 1 and length <= 5' "$f" > /dev/null
            {
              echo '<!-- dev-plan-questions -->'
              echo 'More information is needed before a development plan:'
              echo
              jq -r '.questions | to_entries[] | "\(.key + 1). \(.value)"' "$f"
              echo
              echo "Reason: $(jq -r .rationale "$f")"
            } > "$RUNNER_TEMP/plan.md"
            gh issue edit "$ISSUE" --add-label needs-info
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/plan.md"
            exit 0
          fi
          jq -e '(.objective | type == "string" and length > 0)
                 and (.steps | type == "array" and length >= 2 and length <= 10)
                 and (.spec | type == "array" and length >= 1 and length <= 10)
                 and (.acceptance_criteria | type == "array" and length >= 2 and length <= 10)
                 and (.security | type == "array" and length <= 10)
                 and (.files | type == "array" and length >= 1)
                 and (.risks | type == "array")' "$f" > /dev/null
          # Each security control points at the acceptance criterion that states it and the test that pins
          # it, by number. A plan that does not is refused with the reasons, not silently dropped.
          problems=$(jq -r '
            . as $p
            | ($p.acceptance_criteria | length) as $nc
            | ($p.spec | length) as $ns
            | def whole: type == "number" and . == floor;
              [ .security[] | . as $s
                | (if ($s.category | type == "string" and test("^A(0[1-9]|10)$")) then empty
                   else "\($s.category): not a category from A01 to A10" end),
                  (if ($s.criterion | whole) and $s.criterion >= 1 and $s.criterion <= $nc then empty
                   else "\($s.category): criterion must be the number of an acceptance criterion (1 to \($nc))" end),
                  (if ($s.test | whole) and $s.test >= 1 and $s.test <= $ns then empty
                   else "\($s.category): test must be the number of a test in the list above (1 to \($ns))" end)
              ]
              + (if ([.security[].category] | length) == ([.security[].category] | unique | length) then []
                 else ["a category appears twice; list each category once"] end)
              | .[]' "$f")
          if [ -n "$problems" ]; then
            {
              echo '<!-- dev-plan-error -->'
              echo 'The development plan was refused because its security section does not link to the criteria and tests:'
              echo
              printf '%s\n' "$problems" | sed 's/^/- /'
              echo
              echo 'Remove and add the `RELEASE` label again to ask for a new plan.'
            } > "$RUNNER_TEMP/plan.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/plan.md"
            exit 1
          fi
          {
            echo '<!-- dev-plan -->'
            echo '## Development plan'
            echo
            echo "**Objective.** $(jq -r .objective "$f")"
            echo
            echo '**Steps**'
            jq -r '.steps | to_entries[] | "\(.key + 1). \(.value)"' "$f"
            echo
            echo '**Tests first** (red, then green)'
            jq -r '.spec[] | "- `\(.test)`: \(.asserts)"' "$f"
            echo
            echo '**Acceptance criteria**'
            jq -r '.acceptance_criteria | to_entries[] | "\(.key + 1). \(.value)"' "$f"
            echo
            if [ "$(jq '.security | length' "$f")" -gt 0 ]; then
              echo '**Security** (OWASP Top 10:2025)'
              jq -r '.security[] | "- \(.category): \(.risk) Control: \(.control) (criterion \(.criterion), test \(.test))"' "$f"
            else
              echo '**Security** (OWASP Top 10:2025): no category applies.'
            fi
            echo
            echo '**Files**'
            jq -r '.files[] | "- `\(.)`"' "$f"
            if [ "$(jq '.risks | length' "$f")" -gt 0 ]; then
              echo
              echo '**Risks and assumptions**'
              jq -r '.risks[] | "- \(.)"' "$f"
            fi
            echo
            jq -r .rationale "$f"
            echo
            echo 'Reply `/approve` to start the execution. Edit this comment first to change the plan; the execution reads it as it is when approved.'
          } > "$RUNNER_TEMP/plan.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/plan.md"

      - name: Record the plan run
        if: always() && steps.plan.outcome != 'skipped'
        id: record
        uses: $/.github/actions/record-run
        with:
          execution_file: ${{ steps.plan.outputs.execution_file }}
          stage: dev-plan
          model: ${{ inputs.model }}
          auth: oauth
          issue: ${{ github.event.issue.number }}

      - name: Upload the record
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.record.outputs.record_path }}
          if-no-files-found: warn
          retention-days: 90
