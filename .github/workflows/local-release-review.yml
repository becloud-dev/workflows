name: local-release-review

on:
  issue_comment:
    types: [created]

jobs:
  release-review:
    if: ${{ github.event.issue.pull_request && (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/reject')) }}
    concurrency:
      group: release-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: $/.github/workflows/release-review.yml
    with:
      model: claude-opus-5-5
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
