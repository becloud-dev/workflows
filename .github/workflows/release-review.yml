name: release-review

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      owners:
        description: Comma-separated logins, no spaces
        type: string
        required: true
    secrets:
      claude_code_oauth_token:
        required: true

permissions: {}

jobs:
  release-review:
    name: Release review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: contains(format(',{0},', inputs.owners), format(',{0},', github.event.sender.login))
    permissions:
      contents: read # check out the caller repository
      pull-requests: write # comment on the release PR
      issues: read # list the open release-blocker issues
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          sparse-checkout: prompts
          persist-credentials: false

      - name: Read the command and build the input
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          first=$(printf '%s' "$BODY" | head -n 1 | tr -d '\r')
          case "$first" in
            /review) kind=review ;;
            /reject) kind=reject ;;
            *)
              echo "::error::the first line of the comment must be exactly /review or /reject"
              exit 1
              ;;
          esac
          stop() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$1" > /dev/null
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          [ "$(jq -r .state <<< "$pr")" = open ] \
            || stop "No review: this pull request is not open."
          case "$(jq -r .head.ref <<< "$pr")" in
            release-please--branches--*) ;;
            *) stop "No review: this is not a release pull request (its branch is not \`release-please--branches--*\`)." ;;
          esac
          [ "$(jq -r '.head.repo.full_name // ""' <<< "$pr")" = "$GITHUB_REPOSITORY" ] \
            || stop "No review: the release branch is not in this repository."
          tag=$(git describe --tags --abbrev=0 HEAD 2> /dev/null || true)
          [ -n "$tag" ] \
            || stop "No review: there is no tag in the history, so there is no range to review. Create the first tag."
          sha=$(git rev-parse HEAD)
          [ "$(git rev-list --count "$tag..$sha")" -gt 0 ] \
            || stop "No review: there is no commit since \`$tag\`."
          range="$tag...$sha"
          reason=""
          if [ "$kind" = reject ]; then
            reason=$(printf '%s' "$BODY" | tail -n +2 | tr -d '\r' | sed -e 's/[[:space:]]*$//')
            [ -n "$(printf '%s' "$reason" | tr -d '[:space:]')" ] \
              || stop "No review: \`/reject\` needs the reason on the lines after it."
          fi
          previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[]' \
            | jq -s 'map(select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- release-review -->")))) | last // empty')
          if [ "$kind" = reject ] && [ -z "$previous" ]; then
            stop "No review: there is no earlier review on this pull request to reject. Comment \`/review\` first."
          fi
          blockers=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-blocker --state open \
            --limit 100 --json number,title)
          commits=$(git log -n 200 "$range" --format=%s | jq -R . | jq -s .)
          jq -n --argjson pr "$pr" --arg range "$range" --argjson commits "$commits" \
            --argjson blockers "$blockers" \
            --arg previous "$(jq -r '.body // empty' <<< "${previous:-null}")" --arg reason "$reason" '
            { pr: {number: $pr.number, title: $pr.title, head: $pr.head.ref},
              range: $range, commits: $commits, open_blockers: $blockers,
              previous_review: (if $previous == "" then null else $previous end),
              reject_reason: (if $reason == "" then null else $reason end) }' \
            > "$RUNNER_TEMP/release-input.json"
          {
            echo "ok=true"
            echo "kind=$kind"
            echo "range=$range"
            echo "input_file=$RUNNER_TEMP/release-input.json"
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          prompt: |
            Repository: ${{ github.repository }}
            Pull request: ${{ github.event.issue.number }}
            Input file: ${{ steps.gate.outputs.input_file }}
            Read .ai-workflows/prompts/release-review.md and follow it.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","maxItems":12,"items":{"type":"object","properties":{"title":{"type":"string"},"location":{"type":"string"},"body":{"type":"string"},"blocking":{"type":"boolean"},"type":{"type":"string","enum":["Bug","Task","Feature"]}},"required":["title","location","body","blocking","type"]}}},"required":["summary","findings"]}'

      - name: Post the review
        if: steps.gate.outputs.ok == 'true' && steps.review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.structured_output }}
          PR: ${{ github.event.issue.number }}
          RANGE: ${{ steps.gate.outputs.range }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/review.json"
          printf '%s\n' "$VERDICT" > "$f"
          jq -e '(.summary | type == "string" and length > 0)
                 and (.findings | type == "array" and length <= 12)
                 and ([.findings[] | select(.blocking | not)] | length <= 5)
                 and all(.findings[];
                       (.title | type == "string" and length > 0)
                       and (.location | type == "string" and test("^[^ ]+:[0-9]+"))
                       and (.body | type == "string" and length > 0)
                       and (.type | IN("Bug", "Task", "Feature")))' "$f" > /dev/null
          end=${RANGE##*...}
          label="${RANGE%%...*}...${end:0:7}"
          item='to_entries[] | "\(.key + 1). **\(.value.title)** (`\(.value.location)`, \(.value.type))\n   \(.value.body | gsub("\n"; "\n   "))\n"'
          {
            echo '<!-- release-review -->'
            echo "<!-- release-review-sha: $end -->"
            echo "## Release review: $label"
            echo
            jq -r .summary "$f"
            if [ "$(jq '[.findings[] | select(.blocking)] | length' "$f")" -gt 0 ]; then
              echo
              echo '### Fix now (blocking)'
              echo
              jq -r "[.findings[] | select(.blocking)] | $item" "$f"
            fi
            if [ "$(jq '[.findings[] | select(.blocking | not)] | length' "$f")" -gt 0 ]; then
              echo
              echo '### Defer'
              echo
              jq -r "[.findings[] | select(.blocking | not)] | $item" "$f"
            fi
            if [ "$(jq '.findings | length' "$f")" -eq 0 ]; then
              echo
              echo 'No finding.'
            fi
            echo
            echo 'Reply `/approve` to create the issues, or `/reject` with the reason on the next lines. Edit this comment first to change the findings; the issues are made from it as it is when approved.'
          } > "$RUNNER_TEMP/review.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/review.md" > /dev/null

      - name: Record the review run
        if: always() && steps.review.outcome != 'skipped'
        id: record
        uses: $/.github/actions/record-run
        with:
          execution_file: ${{ steps.review.outputs.execution_file }}
          stage: release-review
          model: ${{ inputs.model }}
          auth: oauth
          issue: ${{ github.event.issue.number }}

      - name: Upload the record
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.record.outputs.record_path }}
          if-no-files-found: warn
          retention-days: 90
