# Checks that the title of a pull request is a Conventional Commit with a listed type and scope. The types and scopes
# inputs reach the action only through with:, never through an expression in a run: block, and the job token is
# limited to reading the pull request.
name: pr-title

on:
  workflow_call:
    inputs:
      types:
        description: Conventional Commit types a pull request title may use, one per line
        type: string
        default: |
          build
          chore
          ci
          docs
          feat
          fix
          perf
          refactor
          revert
          style
          test
      scopes:
        description: Regular expression that a scope of a pull request title must match
        type: string
        default: '[a-z0-9-]+'

permissions: {}

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the title of the pull request
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
