<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <link rel="stylesheet" href="{{ get_url(path='styles.css') }}">
    {# Swap 4xx too (inline messages); a 5xx stays an error. #}
    <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"4..","swap":true},{"code":"5..","swap":false,"error":true}]}'>
    <script src="{{ get_url(path='htmx.min.js') }}" defer></script>
  </head>
  <body hx-boost="true">
    <header class="topbar">
      <a class="brand" href="{{ get_url(path='/') }}">{{ config.title }}</a>
      <nav>
        <a href="{{ get_url(path='@/study/_index.md') }}">Study</a>
        <a href="{{ get_url(path='@/questions/_index.md') }}">Practice</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock content %}</main>
    <footer class="site-footer"><p>{{ config.extra.disclaimer }}</p></footer>
  </body>
</html>
