name: dev-execute

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dev-execute:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve') }}
    concurrency:
      group: dev-execute-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the caller repository
      issues: write # comment
    uses: becloud-dev/workflows/.github/workflows/dev-execute.yml@v0
    with:
      execute_model: claude-haiku-5-5
      check_model: claude-sonnet-5-5
      owners: ${{ vars.OWNERS }}
      setup_command: ${{ vars.SETUP_COMMAND }}
      check_command: ${{ vars.CHECK_COMMAND }}
      test_command: ${{ vars.TEST_COMMAND }}
      test_paths: ${{ vars.TEST_PATHS }}
      executor_app_client_id: ${{ vars.EXECUTOR_APP_CLIENT_ID }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      executor_app_private_key: ${{ secrets.EXECUTOR_APP_PRIVATE_KEY }}
