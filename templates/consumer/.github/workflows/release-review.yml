name: release-review

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  release-review:
    if: ${{ github.event.issue.pull_request && (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/reject')) }}
    concurrency:
      group: release-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the caller repository
      pull-requests: write # comment on the release PR
      issues: read # list the open release-blocker issues
    uses: becloud-dev/workflows/.github/workflows/release-review.yml@v0
    with:
      model: claude-opus-5-5
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
