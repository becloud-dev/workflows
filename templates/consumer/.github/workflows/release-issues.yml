name: release-issues

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  release-issues:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve') }}
    concurrency:
      group: release-issues-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the caller repository
      issues: write # create the issues, label them, set type and Priority, comment
      pull-requests: write # read the release PR and comment on it
    uses: becloud-dev/workflows/.github/workflows/release-issues.yml@v0
    with:
      model: claude-sonnet-5-5
      priority_field_id: ${{ vars.PRIORITY_FIELD_ID }}
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
