name: release-issues

on:
  issue_comment:
    types: [created]

jobs:
  release-issues:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve') }}
    concurrency:
      group: release-issues-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: becloud-dev/workflows/.github/workflows/release-issues.yml@v0
    with:
      model: claude-sonnet-5-5
      priority_field_id: ${{ vars.PRIORITY_FIELD_ID }}
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
