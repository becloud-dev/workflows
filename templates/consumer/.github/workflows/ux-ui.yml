name: ux-ui

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  ux-ui:
    if: github.event.label.name == 'UX/UI'
    concurrency:
      group: ux-ui-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the caller repository and the shared prompts
      issues: write # comment, add the needs-info label
    uses: becloud-dev/workflows/.github/workflows/ux-ui.yml@v0
    with:
      model: claude-sonnet-5-5
      owners: ${{ vars.OWNERS }}
      design_system_path: docs/design-system.md
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
