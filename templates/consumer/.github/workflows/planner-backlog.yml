name: planner-backlog

on:
  workflow_dispatch:

permissions: {}

jobs:
  planner-backlog:
    concurrency:
      group: planner-backlog
      cancel-in-progress: false
    permissions:
      contents: read # check out the workflows CLI and prompts
      issues: read # list open issues with type, issue field values, sub-issues and dependencies; the report writes nothing
    uses: becloud-dev/workflows/.github/workflows/planner-backlog.yml@v0
    with:
      model: claude-haiku-5-5
      owners: ${{ vars.OWNERS }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
